name: ai-workshop

x-backend: &backend
  image: ai-workshop-backend:local
  build:
    context: ../../backend
    dockerfile: Dockerfile
  environment: &backend-environment
    AI_WORKSHOP_ENVIRONMENT: ${AI_WORKSHOP_ENVIRONMENT:-local}
    AI_WORKSHOP_SECRET_KEY: ${AI_WORKSHOP_SECRET_KEY:-local-development-secret-change-before-sharing}
    AI_WORKSHOP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_workshop}:${POSTGRES_PASSWORD:-ai_workshop}@postgres:5432/${POSTGRES_DB:-ai_workshop}
    AI_WORKSHOP_REDIS_URL: redis://redis:6379/0
    AI_WORKSHOP_OBJECT_STORE_ROOT: /data/objects
    AI_WORKSHOP_ELASTICSEARCH_URL: http://elasticsearch:9200
    AI_WORKSHOP_ELASTICSEARCH_INDEX_PREFIX: ${AI_WORKSHOP_ELASTICSEARCH_INDEX_PREFIX:-ai-workshop-rag}
    AI_WORKSHOP_MODEL_CACHE_ROOT: /models
  volumes:
    - object-data:/data/objects
    - model-cache:/models

services:
  object-store-init:
    <<: *backend
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data/objects"]
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "ai_workshop.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      object-store-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    environment:
      <<: *backend-environment
      AI_WORKSHOP_MODEL_CACHE_ROOT: /models
    volumes:
      - object-data:/data/objects
      - model-cache:/models
    command:
      [
        "celery",
        "-A",
        "ai_workshop.worker:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    depends_on:
      object-store-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A ai_workshop.worker:celery_app inspect ping --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  beat:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "ai_workshop.worker:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    depends_on:
      object-store-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    restart: "no"
    depends_on:
      object-store-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  e2e:
    <<: *backend
    command: ["pytest", "-p", "no:cacheprovider", "tests/e2e", "-q"]
    profiles: ["test"]
    environment:
      AI_WORKSHOP_ENVIRONMENT: test
      AI_WORKSHOP_E2E: "1"
      AI_WORKSHOP_E2E_BASE_URL: http://api:8000
      AI_WORKSHOP_SECRET_KEY: ${AI_WORKSHOP_SECRET_KEY:-local-development-secret-change-before-sharing}
      AI_WORKSHOP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_workshop}:${POSTGRES_PASSWORD:-ai_workshop}@postgres:5432/${POSTGRES_DB:-ai_workshop}
      AI_WORKSHOP_REDIS_URL: redis://redis:6379/0
      AI_WORKSHOP_OBJECT_STORE_ROOT: /data/objects
      AI_WORKSHOP_ELASTICSEARCH_URL: http://elasticsearch:9200
      AI_WORKSHOP_ELASTICSEARCH_INDEX_PREFIX: ${AI_WORKSHOP_ELASTICSEARCH_INDEX_PREFIX:-ai-workshop-rag}
      AI_WORKSHOP_MODEL_CACHE_ROOT: /models
    depends_on:
      api:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
      beat:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_workshop}
      POSTGRES_USER: ${POSTGRES_USER:-ai_workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_workshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  model-tools:
    image: ai-workshop-backend:local
    build:
      context: ../../backend
      dockerfile: Dockerfile
    profiles: ["model-tools"]
    command:
      [
        "ai-workshop",
        "register-rag-models",
        "--catalog-dir",
        "/app/model-profiles/rag/models",
      ]
    environment:
      AI_WORKSHOP_ENVIRONMENT: ${AI_WORKSHOP_ENVIRONMENT:-local}
      AI_WORKSHOP_SECRET_KEY: ${AI_WORKSHOP_SECRET_KEY:-local-development-secret-change-before-sharing}
      AI_WORKSHOP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_workshop}:${POSTGRES_PASSWORD:-ai_workshop}@postgres:5432/${POSTGRES_DB:-ai_workshop}
      AI_WORKSHOP_MODEL_CACHE_ROOT: /models
    volumes:
      - model-cache:/models
      - ../../model-profiles:/app/model-profiles:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  model-cache:
  object-data:
  postgres-data:
  redis-data:
  elasticsearch-data:
