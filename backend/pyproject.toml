[project]
name = "ai-workshop-backend"
version = "0.1.0"
description = "Local-first AI Workshop API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "celery[redis]>=5.6,<6.0",
  "email-validator>=2.3,<3.0",
  "elasticsearch[async]>=9.5,<9.6",
  "fastapi>=0.116,<1.0",
  "pymupdf>=1.28,<2.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "psycopg[pool]>=3.2,<4.0",
  "psycopg-binary>=3.2,<4.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sentence-transformers>=6.0,<7.0",
  "pyyaml>=6.0,<7.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn>=0.35,<1.0",
]

[project.scripts]
ai-workshop = "ai_workshop.platform.identity.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
  "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workshop"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest-tmp"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ai_workshop"]
