[project]
name = "ai-workshop-backend"
version = "0.1.0"
description = "Local-first AI Workshop API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "httpx2",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<10.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workshop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ai_workshop"]
